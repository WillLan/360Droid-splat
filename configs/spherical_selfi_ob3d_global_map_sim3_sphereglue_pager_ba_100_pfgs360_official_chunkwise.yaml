base_config: spherical_selfi_ob3d_global_map_sim3_sphereglue_pager_ba_100_pfgs360_refined_anchor_50_200.yaml

# PFGS360-style backend schedule on the confirmed PaGeR + SphereGlue +
# Global-Map-Sim3 + Refiner mainline.  This configuration is deliberately
# separate from the historical CAMERA50/JOINT200 configurations.
SphericalSelfiGlobalBackend:
  map_optimization:
    strategy: pfgs360_official_chunkwise
    steps_per_window: 1
    initial_steps: 1000
    camera_steps: 500
    joint_steps: 500
    final_finetune_steps: 10000
    finetune_topology_steps: 500
    frame_scope: all_visited
    sampling_policy: pfgs360_latter_half_biased
    latter_half_probability: 0.7
    gaussian_update_scope: official_full_tensor
    rollback_policy: none
    pose_lr: 1.0e-3
    joint_pose_lr: 1.0e-3
    pose_grad_clip_value: 1.0e-2
    xyz_lr: 1.6e-4
    feature_lr: 2.5e-3
    sh_rest_lr: 1.25e-4
    opacity_lr: 5.0e-2
    scaling_lr: 5.0e-3
    rotation_lr: 1.0e-3
    adam_eps: 1.0e-15
    pfgs360:
      frame_scope: all_visited
      sampling_policy: pfgs360_latter_half_biased
      gaussian_update_scope: official_full_tensor
      rollback_policy: none
      growth_source: refined_anchor
      bootstrap_source: refined_anchor_all_views
      growth_frame_policy: chunk_new_frames
      validity_gate: pfgs360_official_sky_only
      atomic_refined_anchor_replacement: true
      append_only_refined_anchors: true
      growth_hash_dedup_enabled: true
      topology_refine_enabled: true
      exclude_new_frames_from_delete_evidence: true
      random_background: true
      save_recovery_checkpoints: true
      refine_every_joint_steps: 100
      absgrad_threshold: 8.0e-5
      split_scale_threshold: 0.01
      split_samples: 2
      cull_opacity: 0.005
      ood_distance: 1.0e5
      initial_depth_weight: 0.01
      distortion_weight: 0.01
      opacity_regularizer_weight: 0.01
      scale_regularizer_weight: 0.01
      scale_ratio_threshold: 10.0
      phys_ratio_weight: 0.1
      phys_ratio_every: 10
      finetune_xyz_lr_final: 1.6e-6
      finetune_pose_lr_final: 5.0e-6

Training:
  pfgs360_absgrad: true
  pfgs360_distloss: true

WeightsAndBiases:
  group: ob3d-sponza-global-map-sim3-sphereglue-pager-pfgs360-official
  run_name: ob3d100_globalmap_sphereglue_pager_pfgs360_official_chunkwise_r1
  tags:
    - spherical-selfi
    - ob3d
    - sponza
    - non-egocentric
    - pager-si-depth
    - sphereglue-ba
    - global-map-anchor
    - refined-anchor-growth
    - pfgs360-official-backend
    - initial1000
    - camera500
    - joint500
    - finetune10000
    - formal100

Results:
  save_dir: outputs/ob3d100_globalmap_sphereglue_pager_pfgs360_official_chunkwise_r1
  save_final_checkpoint: true
